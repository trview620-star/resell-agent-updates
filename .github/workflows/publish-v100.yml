name: Publish Resell Agent v1.0.0
on:
  push:
    paths:
      - '.github/workflows/publish-v100.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'trview620-star/resell-agent-updates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.5.7 --repo "$GITHUB_REPOSITORY" --pattern 'resell-agent-mvp-v0.5.7.zip*' --dir .

      - name: Build integrated update and checksum
        run: python scripts/build_release_v100.py resell-agent-mvp-v0.5.7.zip

      - name: Validate archive safety
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          a=Path('resell-agent-mvp-v1.0.0.zip')
          assert hashlib.sha256(a.read_bytes()).hexdigest()==Path(str(a)+'.sha256').read_text().split()[0]
          with ZipFile(a) as z:
              names=z.namelist()
              assert 'resell-agent-starter/agent/ui_command_center.py' in names
              assert "VERSION = '1.0.0'" in z.read('resell-agent-starter/agent/updater.py').decode()
              assert not any(n.startswith('resell-agent-starter/data/') for n in names)
          PY

      - name: Run full Python test suite and compile
        run: |
          mkdir release-test
          cd release-test
          unzip -q ../resell-agent-mvp-v1.0.0.zip
          python -m pip install -q -r resell-agent-starter/requirements.txt
          cd resell-agent-starter
          python -m compileall -q app.py agent tests
          python -m unittest discover -s tests -v

      - name: Publish verified single release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 \
            resell-agent-mvp-v1.0.0.zip \
            resell-agent-mvp-v1.0.0.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Resell Agent v1.0.0 - Integrated Command Center" \
            --notes "Major integrated release: opportunity scores, supplier/resale evidence, event matching, original photo enhancements, Ollama photo/text tools, seven-marketplace listing exports, optional authorized eBay Inventory API, shipping conflict alerts, and all previous monitoring/updater features. Other live marketplace publishing and supplier orders still require separate authorized integrations and end-to-end tests."
