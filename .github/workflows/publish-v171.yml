name: Publish Resell Agent v1.7.1 - Private Dashboard Price Fix
on:
  push:
    paths:
      - '.github/workflows/publish-v171.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'trview620-star/resell-agent-updates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v1.7.0 with checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.7.0 --repo "$GITHUB_REPOSITORY" --pattern 'resell-agent-mvp-v1.7.0.zip*' --dir .
      - name: Build release
        run: python scripts/build_release_v171.py resell-agent-mvp-v1.7.0.zip
      - name: Verify output
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile
          p=Path('resell-agent-mvp-v1.7.1.zip')
          assert sha256(p.read_bytes()).hexdigest()==Path(str(p)+'.sha256').read_text().split()[0]
          root='resell-agent-starter/'
          with ZipFile(p) as z:
              assert "VERSION = '1.7.1'" in z.read(root+'agent/updater.py').decode()
              assert 'apply_draft_prices' in z.read(root+'agent/ui_private_dashboard.py').decode()
              assert "MIN_PROFIT=4000" in z.read(root+'agent/private_research.py').decode()
              assert not any(x.startswith(root+'data/') or x.startswith(root+'backups/') for x in z.namelist())
          PY
      - name: Full regression tests
        run: |
          mkdir -p release-test
          cd release-test
          unzip -q ../resell-agent-mvp-v1.7.1.zip
          python -m pip install -q -r resell-agent-starter/requirements.txt
          cd resell-agent-starter
          python -m compileall -q app.py agent tests
          python -m unittest discover -s tests -v
      - name: Run Streamlit private dashboard smoke
        run: |
          cd release-test/resell-agent-starter
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app=AppTest.from_file('app.py',default_timeout=60).run()
          assert not app.exception,[e.message for e in app.exception]
          assert any('Dashboard' in r.options for r in app.radio)
          for page in ('Szállítási ellenőrzés','Vinted','Jófogás','Termékfigyelés','App updates'):
              nav=next(r for r in app.radio if 'Dashboard' in r.options)
              nav.set_value(page)
              app.run()
              assert not app.exception,(page,[e.message for e in app.exception])
              print(page,'rendered')
          PY
      - name: Publish update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.7.1 \
            resell-agent-mvp-v1.7.1.zip \
            resell-agent-mvp-v1.7.1.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Resell Agent v1.7.1 – Private Dark Dashboard" \
            --notes "Implements the approved personal dark dashboard, image-led product research, 13-supplier and Vinted/Jófogás focus, exact postcode shipping-evidence review, market diagnostic links and 4,000 HUF fixed profit after confirmed costs. Selling prices are now also inserted in newly created zero-priced drafts. No fake shipping promises or sales figures; all legacy data and updates preserved."
